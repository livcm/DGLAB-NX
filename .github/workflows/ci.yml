#---------------------------------------------------------------------------------
# Build every component and run the host side tests.
#
#   pull_request, push to main, manual dispatch - build check
#   workflow_call                              - release.yml reuses this, so
#                                                "what gets built and tested"
#                                                has exactly one definition
#
# The release layout is assembled here as well (release/ -> dist/), because the
# SD card layout only ever changes in the same place as the build.
#
# See README.md ("发布") and AGENTS.md §8.1.
#---------------------------------------------------------------------------------
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + host tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The Makefiles stamp the binaries with `git describe --always
          # --dirty`, so the tags have to be in the checkout: a shallow clone
          # would stamp a bare commit hash where a tag was available.
          fetch-depth: 0
          fetch-tags: true

      - name: Trust the checkout
        # Inside the container the steps run as root while the mounted
        # workspace belongs to the runner's user, so git refused to read the
        # repository at all: "fatal: detected dubious ownership". That is why
        # `git describe` failed and the v0.3.0 release shipped "unknown" as its
        # build stamp, leaving its About page and its dglab-sys.log with no way
        # to tell which build they came from - the one thing the stamp is for.
        shell: bash
        run: |
          set -uo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # The runner's bash already runs with -e, so a failing substitution
          # in an assignment would end the step; testing it instead reports it.
          if ! stamp=$(git describe --always --dirty 2>&1); then
            echo "::warning::git describe still fails: $stamp"
            exit 1
          fi
          echo "build stamp: $stamp"

      - name: Check tag against VERSION
        # Only tag builds: the tag is what names the release, and a release
        # whose tag disagrees with VERSION would ship an NACP and an About page
        # carrying the other number. Fail before compiling anything.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          file_version=$(cat VERSION)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($file_version)"
            echo "tag:     $GITHUB_REF_NAME -> $tag_version"
            echo "VERSION: $file_version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches VERSION $file_version"

      - name: Check the toolchain
        # The image is expected to ship devkitA64 + libnx already (that is the
        # whole point of the image), but the snapshot in it can lag behind the
        # libnx the component is developed against, so the toolchain is brought
        # up to date first: a build against an older libnx is not the build the
        # developer runs. Its npdmtool rejected sysmodule/DGLAB-NX-Core.json
        # outright, which reads as "the sysmodule does not build" rather than
        # "the toolchain is stale".
        #
        # The update is retried and then fatal on purpose. Letting it fail
        # quietly (which is what the first runs did) builds against whatever the
        # image happens to carry, and that failure is far harder to read than
        # this one.
        shell: bash
        run: |
          set -uo pipefail
          echo "DEVKITPRO=${DEVKITPRO:-<unset>}"
          echo "cc: $(cc --version 2>&1 | head -n1)"
          ls "$DEVKITPRO/libnx/include/switch" >/dev/null 2>&1 && \
            echo "libnx headers: present" || echo "::warning::libnx headers not found"
          if ! command -v dkp-pacman >/dev/null 2>&1; then
            echo "::error::dkp-pacman is not on PATH, so the toolchain cannot be updated"
            exit 1
          fi

          updated=0
          for attempt in 1 2 3; do
            pacman_log=$(mktemp)
            if dkp-pacman -Syu --needed --noconfirm switch-dev >"$pacman_log" 2>&1; then
              updated=1
              tail -n5 "$pacman_log"
              break
            fi
            # The reason is reported, not just the fact: this update is the
            # difference between building against the libnx the component is
            # developed with and against the image's older one.
            echo "::warning::dkp-pacman -Syu failed (attempt $attempt)"
            while IFS= read -r line; do
              line=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-500)
              echo "::warning::dkp-pacman: $line"
            done < <(tail -n6 "$pacman_log")
            sleep 15
          done
          [ "$updated" -eq 1 ] || {
            echo "::error::could not update switch-dev, refusing to build against a stale toolchain"
            exit 1
          }

          echo "libnx: $(dkp-pacman -Q libnx 2>/dev/null || echo 'version unknown')"
          echo "switch-tools: $(dkp-pacman -Q switch-tools 2>/dev/null || echo 'version unknown')"

      - name: Host tests
        shell: bash
        run: |
          set -uo pipefail
          # Discovered instead of listed, so a new tests/<name>/ is covered by
          # existing. tests/ipc and tests/stack need devkitPro, which is here.
          failed=0
          for makefile in tests/*/Makefile; do
            dir=$(dirname "$makefile")
            log=$(mktemp)
            echo "::group::$dir"
            if make -C "$dir" 2>&1 | tee "$log"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed=1
              # The job log needs a logged in reader; check run annotations do
              # not, and the first error lines are what a reader wants anyway.
              echo "::error::$dir failed"
              matched=0
              while IFS= read -r line; do
                matched=1
                line=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-900)
                echo "::error::$dir: $line"
              done < <(grep -i -E 'error|fail|undefined|not found' "$log" | head -n12)
              if [ "$matched" -eq 0 ]; then
                line=$(tail -n1 "$log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-900)
                echo "::error::$dir: $line"
              fi
            fi
            rm -f "$log"
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Build the release layout
        shell: bash
        run: |
          set -uo pipefail
          log=$(mktemp)
          if make 2>&1 | tee "$log"; then
            exit 0
          fi
          # Same reason as the tests above: a failing step is a bare exit code
          # in the log, while annotations can be read without logging in.
          echo "::error::make failed"
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-900)
            echo "::error::make: $line"
          done < <(grep -i -E 'error|fail|undefined|no such file|not found|cannot' "$log" | head -n8)
          # The tail as well: a tool that dies without saying "error", or one
          # that prints nothing useful, still ends with the line that failed.
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-900)
            echo "::error::make (tail): $line"
          done < <(tail -n6 "$log")
          exit 1

      - name: Assemble the SD card layout
        shell: bash
        run: |
          set -euo pipefail

          # The Title ID directory name is derived from what `make -C sysmodule
          # package` produced: sysmodule/DGLAB-NX-Core.json stays the only
          # place it is written down (AGENTS.md §8.1).
          tid_dir=""
          for dir in release/*/; do
            if [ -f "$dir/exefs.nsp" ]; then
              tid_dir=$(basename "$dir")
              break
            fi
          done
          if [ -z "$tid_dir" ]; then
            echo "::error::no sysmodule package (exefs.nsp) under release/"
            ls -R release || true
            exit 1
          fi
          echo "title id directory: $tid_dir"
          echo "TID_DIR=$tid_dir" >> "$GITHUB_ENV"

          # dist/ is the SD card root: release/<TITLE_ID>/ goes under
          # atmosphere/contents/, the front end under switch/, exactly as
          # README.md's install section describes.
          rm -rf dist
          mkdir -p "dist/atmosphere/contents/$tid_dir" dist/switch/DGLAB-NX
          cp -R "release/$tid_dir/." "dist/atmosphere/contents/$tid_dir/"
          cp -R release/DGLAB-NX/. dist/switch/DGLAB-NX/

          # The overlay is not implemented yet (overlay/AGENTS.md), so this
          # branch does nothing today and picks it up automatically once the
          # component starts producing DGLAB-NX-Ovl.ovl.
          if [ -f release/DGLAB-NX-Ovl.ovl ]; then
            mkdir -p dist/switch/.overlays
            cp release/DGLAB-NX-Ovl.ovl dist/switch/.overlays/
          else
            echo "note: overlay not implemented yet, no .ovl in the package"
          fi
          find dist -type f | sort

      - name: Check the assembled layout
        shell: bash
        run: |
          set -euo pipefail

          # An install that is missing any of these is not installable, and the
          # zip is built from a tree nobody inspected afterwards.
          missing=0
          for path in \
            "dist/atmosphere/contents/$TID_DIR/exefs.nsp" \
            "dist/atmosphere/contents/$TID_DIR/toolbox.json" \
            "dist/atmosphere/contents/$TID_DIR/flags/boot2.flag" \
            dist/switch/DGLAB-NX/DGLAB-NX.nro; do
            if [ ! -f "$path" ]; then
              echo "::error::missing $path"
              missing=1
            fi
          done
          if ! ls dist/switch/DGLAB-NX/lang/*.json >/dev/null 2>&1; then
            # The NRO exits at startup when it finds no language file, so a
            # package without lang/ is broken for every user.
            echo "::error::no language files in dist/switch/DGLAB-NX/lang/"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          # The version is compiled into the NRO (NACP and About page) from the
          # root VERSION file, so finding the string proves the binaries in this
          # package are the ones this VERSION describes.
          version=$(cat VERSION)
          grep -a -F -q "$version" dist/switch/DGLAB-NX/DGLAB-NX.nro || {
            echo "::error::VERSION $version not found in DGLAB-NX.nro"
            exit 1
          }
          echo "layout ok: $TID_DIR, DGLAB-NX $version"

      - name: Upload the SD card layout
        uses: actions/upload-artifact@v7
        with:
          name: dist-sd
          path: dist/
          if-no-files-found: error
          # switch/.overlays is a hidden directory; without this it would be
          # dropped from the artifact once the overlay exists.
          include-hidden-files: true
